<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Redirecionando...</title><meta name="robots" content="noindex,nofollow"></head><body style="font-family:system-ui;padding:32px;text-align:center"><p>Redirecionando para a oferta...</p><p><a id="a" href="https://pcbarato.vercel.app">voltar ao PcBarato</a></p><script>
const p=new URLSearchParams(location.search);
const to=p.get('to');
if(to){
  try{
    const url=decodeURIComponent(to);
    document.getElementById('a').href=url;
    document.getElementById('a').textContent='Continuar para a loja';
    setTimeout(()=>location.href=url, 800);
  }catch(e){}
}
</script></body></html>
